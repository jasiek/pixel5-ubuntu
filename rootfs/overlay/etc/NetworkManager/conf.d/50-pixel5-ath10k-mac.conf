# SPDX-License-Identifier: MIT
# Mainline kernel: ath10k_snoc finds no MAC address ("invalid MAC address;
# choosing random") and picks a new one every boot. Use a stable per-network
# MAC instead (derived from the connection and this machine's ID), so DHCP
# leases and mDNS stay put. Matched on the mainline driver only: the
# downstream wlan.ko keeps the phone's own MAC.
[connection-pixel5-ath10k]
match-device=driver:ath10k_snoc
wifi.cloned-mac-address=stable
