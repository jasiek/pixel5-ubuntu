# Mainline msm (drm/msm): separate_gpu_kms=1 binds the Adreno GPU on its
# own (card0, render-only) and the display (MDSS/DPU, Test 137) as a
# second device, msm-kms (card1). Added when the DT had no display; kept
# so the GPU never waits for the display to probe.
# The downstream kernel's display driver is msm_drm, unaffected.
options msm separate_gpu_kms=1
