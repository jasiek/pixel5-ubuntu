# Mainline msm (drm/msm): our DT has the Adreno GPU but no display
# subsystem yet. In its automatic mode msm then waits for a display
# master that never comes; separate_gpu_kms=1 binds the GPU on its own
# (a render-only DRM device). Revisit once MDSS/DPU is described.
# The downstream kernel's display driver is msm_drm, unaffected.
options msm separate_gpu_kms=1
