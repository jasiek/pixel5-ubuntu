# Headless phone on a cable: a short power-key press must not power it off
# (systemd's default; on the Pixel 2 the bootloader then started charger
# mode, which looked like a spontaneous reboot). Holding it 5 s powers off
# cleanly; much longer is the PMIC's own hard reset.
[Login]
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
