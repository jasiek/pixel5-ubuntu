# SPDX-License-Identifier: MIT
# No remoteproc on this kernel (PIL boots the modem), so no -s; the modem's
# EFS lives in modemst1/modemst2/fsg (rmtfs -P: by partlabel). -r: read-only,
# writes are dropped, so the IMEI/calibration partitions are never changed.
[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -r -P

# The /dev/qcom_rmtfs_uio1 symlink and the partlabels come from udev; the
# firmware service already waits for udev to settle.
[Unit]
Requires=pixel5-firmware.service
After=pixel5-firmware.service
