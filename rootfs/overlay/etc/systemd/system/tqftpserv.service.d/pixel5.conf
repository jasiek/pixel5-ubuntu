# SPDX-License-Identifier: MIT
# Our tqftpserv 1.3 build (scripts/build-qcom-daemons.sh) instead of noble's
# 1.0, which can't serve /readonly/vendor/firmware/. No remoteproc class on
# this kernel: see /etc/pixel5/remoteproc/README.
[Unit]
Requires=qrtr-ns.service pixel5-firmware.service
After=qrtr-ns.service pixel5-firmware.service

[Service]
ExecStart=
ExecStart=/usr/local/sbin/tqftpserv
TemporaryFileSystem=/sys/class
BindReadOnlyPaths=/etc/pixel5/remoteproc:/sys/class/remoteproc
